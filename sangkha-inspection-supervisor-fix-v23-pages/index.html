<script>

document.getElementById('loginForm').addEventListener(
    'submit',
    function(event) {

        event.preventDefault();


        // =========================================
        // ELEMENTS
        // =========================================

        const username =
            document.getElementById(
                'username'
            ).value.trim();


        const password =
            document.getElementById(
                'password'
            ).value.trim();


        const loginButton =
            document.getElementById(
                'loginButton'
            );


        const loginButtonText =
            document.getElementById(
                'loginButtonText'
            );


        const loginButtonIcon =
            document.getElementById(
                'loginButtonIcon'
            );


        // =========================================
        // VALIDATION
        // =========================================

        if (
            !username ||
            !password
        ) {

            alert(
                'กรุณากรอก Username และ Password'
            );

            return;

        }


        // =========================================
        // LOCK BUTTON
        // =========================================

        loginButton.disabled =
            true;


        loginButtonText.textContent =
            'กำลังเข้าสู่ระบบ...';


        loginButtonIcon.textContent =
            'hourglass_top';


        console.log(
            '========================================'
        );

        console.log(
            'เริ่ม Login'
        );

        console.log(
            'Username:',
            username
        );

        console.log(
            '========================================'
        );


        // =========================================
        // VERIFY LOGIN
        // =========================================

        google.script.run

            .withSuccessHandler(
                function(result) {

                    console.log(
                        'LOGIN RESULT:',
                        result
                    );


                    // ---------------------------------
                    // LOGIN FAILED
                    // ---------------------------------

                    if (
                        !result ||
                        result.success !== true
                    ) {

                        alert(
                            result?.message ||
                            'เข้าสู่ระบบไม่สำเร็จ'
                        );


                        resetLoginButton();

                        return;

                    }


                    // ---------------------------------
                    // GET SESSION
                    // ---------------------------------

                    const sessionId =
                        String(
                            result.sessionId || ''
                        ).trim();


                    if (!sessionId) {

                        console.error(
                            'Backend ไม่ส่ง sessionId:',
                            result
                        );


                        alert(
                            'เข้าสู่ระบบสำเร็จ แต่ไม่พบ Session ID'
                        );


                        resetLoginButton();

                        return;

                    }


                    // ---------------------------------
                    // GET USER
                    // ---------------------------------

                    const user =
                        result.user || {};


                    const role =
                        String(
                            user.Role || ''
                        )
                        .trim()
                        .toLowerCase();


                    console.log(
                        'Login สำเร็จ'
                    );


                    console.log(
                        'Session ID:',
                        sessionId
                    );


                    console.log(
                        'User:',
                        user
                    );


                    console.log(
                        'Role:',
                        role
                    );


                    // =================================
                    // SAVE SESSION
                    // =================================

                    try {

                        sessionStorage.setItem(
                            'sessionId',
                            sessionId
                        );


                        sessionStorage.setItem(
                            'user',
                            JSON.stringify(
                                user
                            )
                        );


                    } catch (storageError) {

                        console.error(
                            'Storage Error:',
                            storageError
                        );

                    }


                    console.log(
                        'Stored Session:',
                        sessionStorage.getItem(
                            'sessionId'
                        )
                    );


                    // =================================
                    // WEB APP URL
                    // =================================

                    // Cloudflare Pages has no Apps Script template variables.
                    // Route within the same Pages site instead.
                    const webAppUrl = window.location.origin;


                    if (!webAppUrl) {

                        alert(
                            'ไม่พบ Web App URL'
                        );


                        resetLoginButton();

                        return;

                    }


                    // =================================
                    // ROLE ROUTING
                    // =================================

                    let targetPage = '';


                    if (
                        role === 'inspector'
                    ) {

                        targetPage =
                            'inspector';

                    }
                                        else if (
                        role === 'supervisor'
                    ) {
                        targetPage =
                            'supervisor';
                    }
                    else if (
                        role === 'admin'
                    ) {
                        targetPage =
                            'admin';
                    }
                    else {
                        console.error(
                            'ไม่รู้จัก Role:',
                            user.Role
                        );


                        alert(
                            'บัญชีนี้ไม่มีสิทธิ์เข้าใช้งานระบบ'
                        );


                        resetLoginButton();

                        return;

                    }


                    // =================================
                    // TARGET URL
                    // =================================

                    const targetUrl =
                        webAppUrl +
                        '/' +
                        targetPage +
                        '.html?sessionId=' +
                        encodeURIComponent(
                            sessionId
                        );


                    console.log(
                        '========================================'
                    );


                    console.log(
                        'กำลังไปหน้า:',
                        targetPage
                    );


                    console.log(
                        'Target URL:',
                        targetUrl
                    );


                    console.log(
                        'Role:',
                        role
                    );


                    console.log(
                        'Session:',
                        sessionId
                    );


                    console.log(
                        '========================================'
                    );


                    // =================================
                    // REDIRECT
                    // =================================

                    window.location.href =
                        targetUrl;

                }
            )


            .withFailureHandler(
                function(error) {

                    console.error(
                        'LOGIN ERROR:',
                        error
                    );


                    alert(
                        error?.message ||
                        'เกิดข้อผิดพลาดในการเชื่อมต่อระบบ'
                    );


                    resetLoginButton();

                }
            )


            .verifyLogin(
                username,
                password
            );


        // =========================================
        // RESET
        // =========================================

        function resetLoginButton() {

            loginButton.disabled =
                false;


            loginButtonText.textContent =
                'เข้าสู่ระบบ';


            loginButtonIcon.textContent =
                'arrow_forward';

        }

    }
);

</script>
